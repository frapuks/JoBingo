server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Résolveur DNS de Docker, relu toutes les 10 s : quand l'API est recréée, son IP
    # change, et un nom résolu une fois pour toutes au démarrage donnerait des 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Même origine que le front : pas de CORS, et le cookie de session suit tout seul.
    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Noms empreintés par Vite : le contenu d'une URL ne change jamais.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Absent de la table MIME par défaut de Nginx ; servi en text/plain, le manifeste
    # serait ignoré par le navigateur sans le moindre message d'erreur.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Tout le reste a un nom stable et un contenu qui change à chaque déploiement
    # (index.html, sw.js, version.json, icônes) : revalidation systématique, sinon
    # l'app reste figée sur l'ancienne version, surtout sur iOS.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
